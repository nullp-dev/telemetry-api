name: telemetry-infra

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/telemetry-infra.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres-exporter
            hook: RENDER_HOOK_POSTGRES_EXPORTER
          - image: prometheus
            hook: RENDER_HOOK_PROMETHEUS
          - image: grafana
            hook: RENDER_HOOK_GRAFANA
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/${{ matrix.image }}
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trigger Render deploy for ${{ matrix.image }}
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        run: |
            curl -fsS "${HOOK}&imgURL=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/telemetry-${{ matrix.image }}:${{ github.sha }}"