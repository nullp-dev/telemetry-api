global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'telemetry-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['telemetry-api-dev:8080']

  - job_name: 'postgres-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['telemetry-postgres-exporter:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']