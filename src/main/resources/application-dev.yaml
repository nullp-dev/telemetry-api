server:
  port: 8080


spring:
  application:
    name: telemetry-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    data:
      repository:
        autotime:
          enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.nullpointer.telemetry: DEBUG

api:
  security:
    telemetry-key: ${TELEMETRY_API_KEY}
